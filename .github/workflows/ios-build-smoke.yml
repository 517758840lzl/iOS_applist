# 免费 Apple 账号可跑：无签名冒烟构建（验证 GitHub Actions 流程）
# 原生 iOS 工程（demolist）；不会产出可安装的正式 IPA
# 触发：GitHub → Actions → iOS Build Smoke → Run workflow
name: iOS Build Smoke

on:
  workflow_dispatch:

jobs:
  build-ios-unsigned:
    # demolist 工程是 Xcode 26 格式（objectVersion 77）；macos-14 默认 Xcode 太旧会报错
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (no codesign)
        run: |
          set -euo pipefail
          xcodebuild \
            -scheme demolist \
            -project demolist.xcodeproj \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Upload unsigned demolist.app
        uses: actions/upload-artifact@v4
        with:
          name: demolist-app-unsigned
          path: build/DerivedData/Build/Products/Release-iphoneos/demolist.app
          if-no-files-found: error
          retention-days: 7
